<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your personal wine cellar, with an AI sommelier" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6d1a36" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1215" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Vintry</title>
    <!-- Paper background before the stylesheet loads, so dark windows do not flash white. -->
    <style>
      html {
        background: #f6f0e6;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #17120f;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Vintry needs JavaScript to run. Please turn it on and reload.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
